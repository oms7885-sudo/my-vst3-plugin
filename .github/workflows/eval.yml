name: Evaluate on real bass recordings

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'Source/BassTracker.h', 'tests/**', '.github/workflows/eval.yml' ]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache datasets
        uses: actions/cache@v4
        with:
          path: data
          key: idmt-bass-v1

      - name: Download IDMT-SMT-Bass datasets (Fraunhofer IDMT, CC BY-NC-ND 4.0)
        run: |
          mkdir -p data && cd data
          if [ ! -d single ]; then
            curl -sSL -o single.zip "https://zenodo.org/records/7544099/files/IDMT-SMT-BASS-SINGLE-TRACKS.zip?download=1"
            unzip -q single.zip -d single && rm single.zip
          fi
          if [ ! -d notes ]; then
            curl -sSL -o notes.zip "https://zenodo.org/records/7188892/files/IDMT-SMT-BASS.zip?download=1"
            unzip -q notes.zip -d notes && rm notes.zip
          fi

      - name: Inspect dataset layout
        run: |
          cd data
          find single -maxdepth 2 | grep -v misc/ | head -40
          find single -name '*.wav' | head -5
          for f in $(find single -name '*note_parameters.csv' | head -2); do echo "--- $f"; head -15 "$f"; done
          find notes -name '*.mat' -o -name '*.pdf'
          python3 -c "import scipy.io as s,sys; m=s.loadmat(sys.argv[1]); print({k:(getattr(v,'shape',None)) for k,v in m.items()})" $(find notes -name '*.mat' | head -1) || true
          ls notes/PS/FS | head -5; ls notes/PS/FS | wc -l

      - name: Build evaluator
        run: g++ -O2 -std=c++17 tests/eval_idmt.cpp -o eval_idmt || echo "evaluator not ready yet"

      - name: Run evaluation
        run: |
          if [ -x ./eval_idmt ]; then ./eval_idmt data | tee eval_report.txt; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.txt
          if-no-files-found: ignore
