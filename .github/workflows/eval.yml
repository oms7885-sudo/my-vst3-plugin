name: Evaluate on real bass recordings

on:
  workflow_dispatch:
    inputs:
      configs:
        description: 'Space separated tracker configs, e.g. "st=2 yt=0.2,rt=4"'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths: [ 'Source/BassTracker.h', 'tests/**', '.github/workflows/eval.yml' ]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache datasets
        uses: actions/cache@v4
        with:
          path: data
          key: idmt-bass-v1

      - name: Download IDMT-SMT-Bass datasets (Fraunhofer IDMT, CC BY-NC-ND 4.0)
        run: |
          mkdir -p data && cd data
          if [ ! -d single ]; then
            curl -sSL -o single.zip "https://zenodo.org/records/7544099/files/IDMT-SMT-BASS-SINGLE-TRACKS.zip?download=1"
            unzip -q single.zip -d single && rm single.zip
          fi
          if [ ! -d notes ]; then
            curl -sSL -o notes.zip "https://zenodo.org/records/7188892/files/IDMT-SMT-BASS.zip?download=1"
            unzip -q notes.zip -d notes && rm notes.zip
          fi

      - name: Build evaluator
        run: g++ -O2 -march=native -std=c++17 -pthread tests/eval_idmt.cpp -o eval_idmt

      - name: Run evaluation
        run: |
          CFGS="${{ github.event.inputs.configs }}"
          if [ -z "$CFGS" ]; then CFGS="$(cat tests/eval_configs.txt 2>/dev/null)"; fi
          ./eval_idmt data "" $CFGS | tee eval_report.txt
          echo; echo "== error details (default config) =="
          VERBOSE=1 ./eval_idmt data "" | sed -n '/^    /p' | head -300 | tee -a eval_report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.txt
          if-no-files-found: ignore
